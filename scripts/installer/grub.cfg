# The nos installer ISO's menu (scripts/installer/build.sh). The installer
# is a small Linux, run from memory: its kernel, its system, and the nos
# system image it pours -- the second initramfs, as the image was built.
# "Try nos" boots that image's kernel by itself: nothing is mounted and
# nothing written, and the screen says which disks and network cards nos
# found -- what decides whether this machine is one nos runs on.

# A UEFI machine has no text mode: without a video driver GRUB gives the
# kernels no framebuffer, and the screen stays dark
insmod all_video

set default=install
set timeout_style=menu
set timeout=10

# The dialog is on the screen, the console named last; the kernel's lines --
# and an install with answers, which draws no dialog, as it goes -- on the
# first serial port as well
menuentry "Install nos" --id install {
    echo "Loading the installer..."
    linux /boot/vmlinuz console=ttyS0,115200n8 console=tty0 quiet
    initrd /boot/initramfs /boot/nos.img
}

menuentry "Install nos, its dialog on the serial port ttyS0 (115200)" --id install-ttyS0 {
    echo "Loading the installer..."
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 quiet
    initrd /boot/initramfs /boot/nos.img
}

menuentry "Install nos, its dialog on the serial port ttyS1 (115200, IPMI SOL)" --id install-ttyS1 {
    echo "Loading the installer..."
    linux /boot/vmlinuz console=tty0 console=ttyS1,115200n8 quiet
    initrd /boot/initramfs /boot/nos.img
}

menuentry "Try nos: boot it from here, writing nothing" --id try {
    insmod multiboot2
    echo "Loading nos..."
    multiboot2 /boot/kernel64.elf dhcp=auto dns=on
}
