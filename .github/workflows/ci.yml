name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nasm cppcheck \
            grub2-common grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            qemu-system-x86 qemu-system-arm
          # The pinned nightly, not whatever nightly is today: src/rust/vendor
          # only resolves against the one src/rust/rust-toolchain.toml names.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --component rust-src --default-toolchain \
              "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' src/rust/rust-toolchain.toml)"

      - name: Static analysis (cppcheck)
        run: make check

      - name: Build ${{ matrix.arch }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          make nocheck ARCH=${{ matrix.arch }}

      - name: Boot smoke test (${{ matrix.arch }}, TCG)
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ./scripts/smoke-test.sh --skip-build
          else
            ./scripts/smoke-arm64.sh --skip-build
          fi

      # The smoke disks carry no partition table, so nothing else here would
      # notice the partition reader breaking.
      - name: Partition table test (${{ matrix.arch }}, TCG)
        run: python3 scripts/parttest.py --arch ${{ matrix.arch }} --tcg

      # The smoke boot's fstest checks that ext2 reads back what it wrote;
      # this checks that what it leaves on the disk is a filesystem e2fsck
      # still calls clean. It drives the shell over UDP, which is the arm64
      # boot's command line.
      - name: ext2 write test (e2fsck, TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/ext2-test.py --tcg

      # nanofs is the one filesystem no smoke boot mounts, so without this
      # nothing here would notice it breaking.
      - name: nanofs test (TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/nanofs-test.py --tcg

      # On the machines with no serial port the kernel log over UDP is the
      # only console there is, and a panic is when it matters most.
      - name: netconsole test (TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/netconsole-test.py --tcg

      # The connecting side of TCP, which the sshd test does not reach.
      - name: TCP test (TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/tcp-test.py --tcg

      # The load target answers from inside the receive path, and is the one
      # thing here that would notice a frame pool that was never built.
      - name: netload test (TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/netload-test.py --tcg

      # The same kernel under clang's undefined-behaviour sanitizer (UBSAN=1,
      # docs/build.md): a check in front of every operation the language
      # leaves undefined, and the first one that fails a panic -- so this
      # smoke boot is a UB check over the whole boot path. Last, because its
      # images replace the ones every step above tests.
      - name: UBSan build and smoke test (${{ matrix.arch }}, TCG)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          make nocheck ARCH=${{ matrix.arch }} UBSAN=1
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ./scripts/smoke-test.sh --skip-build
          else
            ./scripts/smoke-arm64.sh --skip-build
          fi
