name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nasm cppcheck \
            grub2-common grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            qemu-system-x86 qemu-system-arm qemu-utils squashfs-tools parted e2fsprogs
          # The pinned nightly, not whatever nightly is today: src/crates/vendor
          # only resolves against the one src/crates/rust-toolchain.toml names.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --component rust-src --default-toolchain \
              "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' src/crates/rust-toolchain.toml)"

      - name: Static analysis (cppcheck)
        run: make check

      - name: Build ${{ matrix.arch }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          make nocheck ARCH=${{ matrix.arch }}

      - name: Boot smoke test (${{ matrix.arch }}, TCG)
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ./scripts/smoke-test.sh --skip-build
          else
            ./scripts/smoke-arm64.sh --skip-build
          fi

      # What a release's system image does on a server (docs/install.md):
      # nos-install pours it onto a partition, the server's GRUB boots nos
      # from there once, by UUID, its sshd lets in the key it was given and
      # no UDP shell answers; an update keeps the host key, takes a UDP shell
      # asked for and keeps the old kernel for a rollback. losetup and mount
      # are root's, so the Linux half runs under sudo.
      - name: System image test (x86_64, TCG)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          make image
          python3 scripts/image-test.py

      # The hypervisor's MMIO decoder turns a guest's bytes into the access
      # it performs for it, and a wrong decode looks like success: checked
      # against the encodings clang gives, on the host.
      - name: MMIO decoder test (host)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/insn-test.py

      # A guest decides every value the hypervisor's devices and run loop are
      # handed, and a panic, an overflow or a spin there is the host's: the
      # hv sources fuzzed on the host, the same inputs every run.
      - name: Hypervisor fuzz (host)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/hv-fuzz.py

      # What hvboot boots off a guest's disk is the disk's to say -- its
      # partitions, its filesystem, its grub.cfg -- and the wrong entry, or a
      # kernel read wrong, looks like a guest that booted something else: on
      # disks made here, the entry GRUB would boot and its files byte for
      # byte, and each disk's metadata fuzzed, on the host.
      - name: hvboot test (host)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/hvboot-test.py

      # The ext2/3/4 format hvboot reads through, and the kernel's ext4
      # driver is to: a checksum computed wrong is a filesystem the driver
      # refuses as corrupt -- or one it writes that Linux does. Every
      # checksum of filesystems mke2fs makes, held to extfmt's; bytes
      # changed, and extfmt and e2fsck held to both saying so; and fuzzed.
      # And a journal replayed wrong is a filesystem neither as it was nor
      # as it was to be: journals debugfs writes, replayed by extfmt's plan
      # to the image e2fsck's replay leaves, byte for byte.
      - name: ext2/3/4 format test (host)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/extfmt-test.py

      # A cloud's image is a download, and `hv convert` reads it in the
      # kernel: a cluster read wrong is a guest's disk with the wrong bytes
      # in it, and nothing to say so. Converted on the host and held to
      # qemu-img's reading, the decoder to zlib's, the metadata fuzzed.
      - name: Disk image converter test (host)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/diskimage-test.py

      # The editor runs in the kernel on a person's files: a byte changed on
      # a save, an undo that gives back the wrong text, a screen drawn wrong
      # after a resize -- each looks like an editor that works. Its crate on
      # the host: key sessions held to what they leave, files saved back
      # byte for byte, random sessions on a terminal of the test's own.
      - name: Editor test (host)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/edit-test.py

      # What is on a disk is whoever wrote it's to choose, and a panic, a
      # write where nothing may write or an image left corrupt there is
      # anyone's to cause: the block and filesystem layers fuzzed on the
      # host, the same inputs every run.
      - name: Storage fuzz (host)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/fs-fuzz.py

      # A judge wrong about the format holds every driver to the wrong
      # thing, and agrees with it: the images the fuzzer's judges make and
      # call clean, and the power cuts they call unclean, held to e2fsck --
      # an ext4 image's every file to what debugfs reads out of it.
      - name: Storage fuzz judges against e2fsprogs (host)
        if: matrix.arch == 'x86_64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/fs-fuzz.py --e2fsck

      # Everything the network hands the kernel is somebody else's to choose,
      # and a panic, a lock broken or a spin there is anyone's to cause: the
      # network layer, TLS and sshd fuzzed on the host, the same inputs every
      # run. On this leg, the hypervisor's fuzz being on the other.
      - name: Network fuzz (host)
        if: matrix.arch == 'aarch64'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/net-fuzz.py

      # The device tree the arm64 boot is handed, the Multiboot2 tags and
      # the ACPI tables the x86 one is, the firmware's memory map, the
      # command line, the GRUB environment block on /boot, a module's .ko:
      # what the kernel's C++ reads before anything checked it, and a read
      # past an end or a wrap there is a boot that dies without a word; and
      # the memory management under everything. That C++ fuzzed on the host
      # under the address and UB sanitizers, the same inputs every run.
      - name: C++ fuzz (host)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/cpp-fuzz.py

      # The smoke disks carry no partition table, so nothing else here would
      # notice the partition reader breaking.
      - name: Partition table test (${{ matrix.arch }}, TCG)
        run: python3 scripts/parttest.py --arch ${{ matrix.arch }} --tcg

      # The smoke boot's fstest checks that ext2 reads back what it wrote;
      # this checks that what it leaves on the disk is a filesystem e2fsck
      # still calls clean. It drives the shell over UDP, which is the arm64
      # boot's command line.
      - name: ext2 write test (e2fsck, TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/ext2-test.py --tcg

      # nanofs is the one filesystem no smoke boot mounts, so without this
      # nothing here would notice it breaking.
      - name: nanofs test (TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/nanofs-test.py --tcg

      # On the machines with no serial port the kernel log over UDP is the
      # only console there is, and a panic is when it matters most.
      - name: netconsole test (TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/netconsole-test.py --tcg

      # The connecting side of TCP, which the sshd test does not reach.
      - name: TCP test (TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/tcp-test.py --tcg

      # The load target answers from inside the receive path, and is the one
      # thing here that would notice a frame pool that was never built.
      - name: netload test (TCG)
        if: matrix.arch == 'aarch64'
        run: python3 scripts/netload-test.py --tcg

      # The same kernel with both halves checking themselves (docs/build.md):
      # UBSAN=1 puts clang's sanitizer in front of every operation the C++
      # leaves undefined, RUSTUB=1 turns on core's checks of the preconditions
      # of its own unsafe operations and on arithmetic overflow, and the first
      # failure of either is a panic -- so this smoke boot is a UB check over
      # the whole boot path, in both languages. One boot rather than two: it
      # costs the Rust workspace a rebuild (the profile differs) and the boot
      # about half again as long (arm64 under TCG: 22 s against 14 s). Last,
      # because its images replace the ones every step above tests.
      - name: UB checks build and smoke test (${{ matrix.arch }}, TCG)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          make nocheck ARCH=${{ matrix.arch }} UBSAN=1 RUSTUB=1
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ./scripts/smoke-test.sh --skip-build
          else
            ./scripts/smoke-arm64.sh --skip-build
          fi
