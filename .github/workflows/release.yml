name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # x86-64: the disk image build already compiles the kernel inside the
  # builder container (make clean && make nocheck), so the ISO, the qcow2
  # and bin/kernel64.elf all fall out of this one step.
  build-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO, disk image and kernel
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-disk.sh

      # The management panel's bundle (docs/api.md): Node, Caddy and the
      # panel, which `api panel create` has the panel's VM install -- built
      # before the system image, which says where the release has it and its
      # SHA-256 (/lib/panel/bundle).
      - name: Build the panel's bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: python3 scripts/panel-bundle.py --version "$VERSION" --out dist-panel

      # The system image a server's partition is poured from (docs/install.md):
      # the kernel and modules the step above built, in the builder image it
      # left, with the same VERSION and commit -- so nothing is rebuilt and the
      # image's VERSION names the kernel in it.
      - name: Build the system image
        env:
          VERSION: ${{ github.ref_name }}
          PANEL_BUNDLE: dist-panel/nos-panel-${{ github.ref_name }}.tar.gz
          PANEL_BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nos-panel-${{ github.ref_name }}.tar.gz
        run: |
          # GIT_DESC as build-disk.sh worked it out: a checkout has no
          # changes, so the commit alone
          docker run --platform linux/amd64 --rm -e VERSION -e PANEL_BUNDLE -e PANEL_BUNDLE_URL \
            -e GIT_DESC="$(git rev-parse --short HEAD)" \
            -v "$PWD:/src" -w /src nos-builder make image

      # The installer ISO a server boots -- from its provider's virtual media
      # or a USB stick -- to make a whole disk nos's own (docs/install.md,
      # "From an ISO"): Alpine running the dialog over the system image just
      # built, carried in it as it is in the release. What the builder made
      # in the checkout is root's: the build's own directory under out/ is
      # this job's to make.
      - name: Build the installer ISO
        run: |
          sudo chown -R "$(id -u):$(id -g)" out nos-x86_64.squashfs
          ./scripts/installer/build.sh --image nos-x86_64.squashfs --out nos-installer-x86_64.iso
          # Its packages, taken now: the test below builds an ISO of its own
          # in the same place
          cp out/installer/packages.txt nos-installer-packages.txt

      # The ISO is published at a link anyone installs from: it installs, by
      # its answers, under SeaBIOS and is found installed under OVMF, before
      # the release is made (tests/installer-test.py, docs/testing.md)
      - name: Installer test (x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          python3 tests/installer-test.py --image nos-x86_64.squashfs

      - name: Stage the release files
        run: |
          mkdir -p dist
          cp bin/kernel64.elf dist/kernel-x86_64.elf
          cp nos.iso          dist/nos.iso
          cp nos.qcow2        dist/nos.qcow2
          cp nos-x86_64.squashfs dist/nos-x86_64.squashfs
          cp nos-installer-x86_64.iso dist/nos-installer-x86_64.iso
          # The one-line installer (scripts/installer/install.sh), what
          # https://nos-os.tech/install.sh runs: this release's tag written
          # in, so that it fetches this release's image
          sed "s|^NOS_RELEASE=@NOS_RELEASE@\$|NOS_RELEASE=${GITHUB_REF_NAME}|" \
            scripts/installer/install.sh > dist/install.sh
          grep -qx "NOS_RELEASE=${GITHUB_REF_NAME}" dist/install.sh
          # What the installer's Linux is made of, a package and its version
          # a line: Alpine's, GPL software among them, whose sources go by
          # these names
          cp nos-installer-packages.txt dist/nos-installer-packages.txt
          cp dist-panel/nos-panel-*.tar.gz dist/
          # The notice of the CRYPTOGAMS assembly every kernel and module of
          # the release runs (src/crates/base/crypto/cryptogams/README.md):
          # its license asks a binary handed out to carry it
          cp src/crates/base/crypto/cryptogams/LICENSE dist/LICENSE-CRYPTOGAMS
          # Every module the Makefile builds, named for the kernel it loads
          # into: blkload.ko goes up as blkload-x86_64.ko. No match leaves
          # the pattern itself, and cp fails the step on it.
          for ko in out/x86_64/modules/*.ko; do
            cp "$ko" "dist/$(basename "$ko" .ko)-x86_64.ko"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: dist/
          if-no-files-found: error

  # arm64: no ISO and no disk image -- the artifacts are the ELF (symbols,
  # for GDB) and the flat Linux-protocol Image that QEMU/U-Boot boot.
  build-aarch64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          # The pinned nightly, not whatever nightly is today: src/crates/vendor
          # only resolves against the one src/crates/rust-toolchain.toml names.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --component rust-src --default-toolchain \
              "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' src/crates/rust-toolchain.toml)"

      - name: Build aarch64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          make nocheck ARCH=aarch64

      - name: Stage the release files
        run: |
          mkdir -p dist
          cp bin/kernel-arm64.elf dist/kernel-arm64.elf
          cp nos-arm64.img        dist/nos-arm64.img
          for ko in out/aarch64/modules/*.ko; do
            cp "$ko" "dist/$(basename "$ko" .ko)-arm64.ko"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: dist/
          if-no-files-found: error

  release:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -l

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: nos ${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          body: |
            ### Download

            ```sh
            # x86-64 kernel (Multiboot2 ELF, GRUB `multiboot2` / QEMU `-kernel`)
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/kernel-x86_64.elf
            # arm64 kernel (flat Linux `Image`, QEMU virt `-kernel`)
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nos-arm64.img
            # arm64 ELF with symbols, for GDB
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/kernel-arm64.elf
            # bootable media
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nos.iso
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nos.qcow2
            ```

            `latest` works too, without naming the tag:
            `https://github.com/${{ github.repository }}/releases/latest/download/kernel-x86_64.elf`

            ### nos on a server, from its rescue system

            In the server's rescue system -- a Linux its provider boots from the
            network, the disks idle -- one command. A dialog asks which disk is
            to be nos's, how big its root is (10G; the rest of the disk is left
            for VMs and NBS), the network, offered as the rescue system has it
            -- the server's own address -- and the SSH keys, offered as root's
            there; it writes the disk and has the firmware boot nos first after
            its network's entries:

            ```sh
            curl -fsSL https://nos-os.tech/install.sh | sh
            ```

            Without the dialog, nos-install's arguments:

            ```sh
            curl -fsSL https://nos-os.tech/install.sh | sh -s -- disk /dev/sdb --wipe --network-here --ssh-key /root/.ssh/authorized_keys
            ```

            That runs the newest release's `install.sh`; this one's is
            `NOS_VERSION=${{ github.ref_name }}` before `sh`, or `install.sh` here.
            It fetches the system image below, checks it against `SHA256SUMS`
            and runs the installer in it --
            [docs/install.md, "From a provider's rescue system"](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/install.md#from-a-providers-rescue-system).

            ### System image (x86-64 servers)

            `nos-x86_64.squashfs`: the kernel, every module built with it, the
            GRUB entries that boot it, `nos-install`, which pours it onto a whole
            disk or onto a partition beside a server's Linux, and the
            installer's dialog -- [docs/install.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/install.md).
            Beside the server's Linux, booted once through its GRUB:

            ```sh
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nos-x86_64.squashfs
            mount -o loop,ro nos-x86_64.squashfs /mnt
            /mnt/nos-install install /dev/nvme0n1p4 --ssh-key ~/.ssh/id_ed25519.pub --reboot
            ```

            ### Installer ISO (a server's whole disk)

            `nos-installer-x86_64.iso`: for a server installed from an ISO -- its
            provider's virtual media (IPMI, iDRAC, iLO) or a USB stick, BIOS or
            UEFI. A small Linux, run from memory, asks which disk is to be
            nos's, how big its root is (10G unless told; the rest of the disk is
            left blank for VMs and NBS), the network and the SSH keys, and pours
            the system image above onto it; its menu also boots nos from the ISO
            to see what nos finds on the machine, writing nothing. An ISO that
            asks nothing is one built with answers:
            [docs/install.md, "From an ISO"](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/install.md#from-an-iso).

            ```sh
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nos-installer-x86_64.iso
            ```

            The newest release's is always at
            `https://github.com/${{ github.repository }}/releases/latest/download/nos-installer-x86_64.iso`.
            `nos-installer-packages.txt` lists the Alpine packages it is made of,
            by version.

            ### The management panel

            `nos-panel-${{ github.ref_name }}.tar.gz`: the panel, Node and Caddy,
            which `api panel create` has the panel's VM download and install --
            the system image above names it and its SHA-256 in
            `/lib/panel/bundle`. `nos-install --panel` makes root's password and
            has `/etc/rc` make the panel at nos's first boot
            ([docs/api.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/api.md)).

            ### Kernel modules

            Every loadable module in the tree, built with the kernels above:
            `<name>-x86_64.ko` and `<name>-arm64.ko`. From a running nos:

            ```sh
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/blkload-x86_64.ko /blkload.ko
            insmod /blkload.ko
            ```

            A kernel loads only modules built against its own kernel interface
            (a digest of the `ffi` crate's sources), so take them from the
            release the running kernel came from -- `version` names it.

            `SHA256SUMS` covers every file in the release.
          fail_on_unmatched_files: true
          files: |
            dist/kernel-x86_64.elf
            dist/kernel-arm64.elf
            dist/nos-arm64.img
            dist/nos.iso
            dist/nos.qcow2
            dist/nos-x86_64.squashfs
            dist/install.sh
            dist/nos-installer-x86_64.iso
            dist/nos-installer-packages.txt
            dist/nos-panel-*.tar.gz
            dist/*.ko
            dist/SHA256SUMS
