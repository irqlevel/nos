# The multiboot2 header asks for a framebuffer; without a video
# driver loaded GRUB cannot set a mode and silently boots with no
# framebuffer at all -- fatal on UEFI, where there is no text mode.
insmod all_video

set timeout=0
set default=0
menuentry "nos" {
	multiboot2 /boot/kernel64.elf dhcp=auto dns=on root=auto
}
