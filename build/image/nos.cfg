# The GRUB entries of a nos system image (docs/install.md), at
# /boot/grub/nos.cfg on the partition nos-install pours it onto.
#
# The host's GRUB sources this from /etc/grub.d/42_nos, which nos-install
# writes. By then that has found the partition (nos_root, by its UUID,
# nos_uuid) and loaded this machine's own kernel parameters (nos_cmdline)
# from the grubenv there. The entries come from the image and are replaced
# with it, so a new kernel brings the command line it was built to read.
#
# dhcp=auto because a server's network is its only console; root= by UUID,
# never by label, so that two disks poured from one image cannot each be
# taken for the other; panic=10 because a panic there is a machine nobody
# sees until it is reset by hand -- reset by itself, ten seconds after the
# report has gone out, it boots what GRUB boots next, the server's own OS
# after a one-shot nos. /boot/ucode, where nos-install puts this machine's
# microcode, goes beside the kernel as the module `ucode`.

menuentry "nos" --class os --id nos {
	insmod multiboot2
	insmod all_video
	echo "Loading nos..."
	multiboot2 (${nos_root})/boot/kernel64.elf root=UUID=${nos_uuid} dhcp=auto dns=on panic=10 ${nos_cmdline}
	if [ -f (${nos_root})/boot/ucode ]; then
		module2 (${nos_root})/boot/ucode ucode
	fi
	boot
}

# A kernel tried once before it replaces the one above: put there from inside
# nos (wget), booted once by `grubenv /grubenv nos_next=nos-next`.
menuentry "nos (next)" --class os --id nos-next {
	insmod multiboot2
	insmod all_video
	echo "Loading nos (next)..."
	multiboot2 (${nos_root})/boot/kernel64.elf.next root=UUID=${nos_uuid} dhcp=auto dns=on panic=10 ${nos_cmdline}
	if [ -f (${nos_root})/boot/ucode ]; then
		module2 (${nos_root})/boot/ucode ucode
	fi
	boot
}
