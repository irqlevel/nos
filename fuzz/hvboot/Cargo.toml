# hvboot's parsers on the host: its partition tables, ext2/3/4 reader and
# GRUB configuration (src/crates/hypervisor/hvboot/src/{gpt,ext,grub}.rs),
# compiled from their own sources, and the bzImage crate it loads a kernel
# by (src/crates/common/boot/bzimage), run over a disk image --
# what hvboot would boot off it, and the kernel and initrd read out by its
# own reader, to compare with what e2fsprogs reads -- and over random inputs
# (scripts/hvboot-test.py). Its dependencies are the format crate ext.rs
# reads through, the CRC-32 gpt.rs checks by and the bzImage crate, paths of
# the tree's, so it builds offline.
[package]
name = "hvboot-test"
version = "0.1.0"
edition = "2021"

[dependencies]
extfmt = { path = "../../src/crates/common/storage/extfmt" }
crc = { path = "../../src/crates/common/crc" }
bzimage = { path = "../../src/crates/common/boot/bzimage" }

# Overflow checks on, as a RUSTUB=1 build has them: hvboot reads what the
# guest's disk says, and an overflow there is a bug of its own.
[profile.release]
overflow-checks = true
debug-assertions = true
panic = "unwind"

[workspace]
