# The editor (src/rust/edit) on the host, as the edit module runs it: key
# sessions with what they must leave in the file and on the screen, files
# read and written back byte for byte, and sessions of random keys on a
# terminal of the test's own, the editor held to its promises after every
# key (scripts/edit-test.py). Nothing but the crate itself, so it builds
# offline.
[package]
name = "edit-test"
version = "0.1.0"
edition = "2021"

[dependencies]
edit = { path = "../../src/rust/edit" }

# Overflow checks on, as a RUSTUB=1 build has them: an overflow in the editor
# is a bug of its own, and in the kernel a panic.
[profile.release]
overflow-checks = true
debug-assertions = true
panic = "unwind"

[workspace]
