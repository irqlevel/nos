# The raft crate on the host: members of a group in one process over a
# simulated network and simulated disks, held at every step to Raft's
# properties, the known traps as scripted scenarios, and the wire's decoder
# fed noise (scripts/raft-test.py). Its dependencies are the tree's own
# crates, by path, so it builds offline.
[package]
name = "raft-fuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
raft = { path = "../../src/crates/common/cluster/raft" }
# The cluster's registry, the crate's first user (plans/cluster.md).
registry = { path = "../../src/crates/common/cluster/registry" }
# NBS's metadata, its second (plans/nbs.md).
nbsmeta = { path = "../../src/crates/common/storage/nbsmeta" }
# The CRC32C the log's records are checked by, for the known answers and
# for records made by hand.
crc = { path = "../../src/crates/common/crc" }

# nbsmeta's digest is sha2's, on no CPU feature, as net-fuzz has it and for
# its reason: the RustCrypto crates on their software backends, the ones the
# kernel runs -- and the real crate would ask macOS through libc, which the
# vendored tree does not carry.
[patch.crates-io]
cpufeatures = { path = "../net/standins/cpufeatures" }

# Overflow checks on, as a RUSTUB=1 build has them: an overflow in the
# protocol is a bug of its own, and in the kernel a panic.
[profile.release]
overflow-checks = true
debug-assertions = true
panic = "unwind"

[workspace]
