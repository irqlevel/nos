# The disk image converter (src/crates/diskimage) on the host, as the hv
# module runs it: images made by qemu-img converted here and by qemu-img,
# to compare; its DEFLATE decoder held to zlib's answers; and images with
# their metadata changed at random, the code held to never panicking,
# never writing outside the disk and always ending (scripts/diskimage-test.py).
# Nothing but the crate itself, a path of its own, so it builds offline.
[package]
name = "diskimage-test"
version = "0.1.0"
edition = "2021"

[dependencies]
diskimage = { path = "../../src/crates/diskimage" }

# Overflow checks on, as a RUSTUB=1 build has them: what is converted is a
# download, and an overflow on what it says is a bug of its own.
[profile.release]
overflow-checks = true
debug-assertions = true
panic = "unwind"

[workspace]
