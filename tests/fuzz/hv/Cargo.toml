# The hypervisor's guest-facing code, fuzzed on the host: every device a
# guest reaches (hypervisor/hv/src/devices/*), its local APIC and IO-APIC, the MMIO
# decoder, page walker and emulator, the Linux loader and ACPI tables, and
# the run loop that dispatches a guest's exits (hypervisor/hv/src/run.rs), and the
# guests' DHCP server -- compiled from their own sources over stand-ins for
# the kernel and the CPU (tests/hv-fuzz.py builds and runs it). Nothing
# but netwire, conf, bzimage and firewall, paths of their own, so it builds
# offline.
[package]
name = "hv-fuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
# What is on the wire, and nothing else: the guests' DHCP server is built on
# it. No dependencies of its own, so this still builds offline.
netwire = { path = "../../../src/crates/common/net/netwire" }
# vm.toml's text, as the module reads it (the config target). No
# dependencies of its own either.
conf = { path = "../../../src/crates/common/text/conf" }
# A bzImage's header and the zero page the Linux loader makes a guest's by
# (the linux and platform targets). No dependencies of its own either.
bzimage = { path = "../../../src/crates/common/boot/bzimage" }
# Each guest's firewall, which the switch judges its frames by (the switch,
# guestnet and firewall targets). Nothing but netwire under it.
firewall = { path = "../../../src/crates/common/net/firewall" }
# The cluster networks' tunnel's datagram (`vnetwire` target), which takes
# its ChaCha20-Poly1305 from the caller ...
vnetwire = { path = "../../../src/crates/common/net/vnetwire" }
# ... here the vendored RustCrypto one, which hv-fuzz.py builds with, in the
# place of hv.ko's crypto crate (src/aead.rs).
chacha20poly1305 = { version = "0.10.1", default-features = false }
# A VM's state as bytes (`vmstate` target, and every device's and the
# platform's round trips through it). Nothing but codec under it.
vmstate = { path = "../../../src/crates/common/vm/vmstate" }
# A migration's messages and the handover's decisions (`handover` and
# `migwire` targets). Nothing but codec under it.
migwire = { path = "../../../src/crates/common/vm/migwire" }

# What a RUSTUB=1 kernel has on: an overflow is a panic, not a wrap -- and a
# guest that can cause one can bring down the host that runs it.
[profile.release]
overflow-checks = true
debug-assertions = true
panic = "unwind"

[workspace]
