[workspace]
members = [
    "kernel",
    "base/crypto", "base/events", "base/ffi", "base/hello", "base/kcore", "base/kmod", "base/random",
    "layers/block", "layers/fs", "layers/ipc", "layers/mgmt", "layers/net", "layers/tls",
    "drivers/block/ahci", "drivers/block/ata", "drivers/block/nvme", "drivers/block/virtio_blk", "drivers/block/virtio_scsi", "drivers/net/e1000e", "drivers/net/igb", "drivers/net/mlx4", "drivers/net/r8125", "drivers/net/r8168", "drivers/net/virtio_net", "drivers/rng/virtio_rng", "drivers/usb", "drivers/virtio",
    "hypervisor/hv", "hypervisor/hvarch", "hypervisor/hvboot",
    "modules/cluster/cluster", "modules/cluster/ipcctl", "modules/cluster/ipcnet", "modules/cluster/raftmember", "modules/hypervisor/hv", "modules/mgmt/api", "modules/net/netload", "modules/net/sshd", "modules/net/tlsbench", "modules/net/vnet", "modules/storage/blkload", "modules/storage/nbs-cs", "modules/storage/nbs-mds", "modules/storage/nbsdrive", "modules/storage/nbsload", "modules/storage/nbstrace", "modules/storage/netblk", "modules/test/heapbench", "modules/test/hello", "modules/test/modtest", "modules/test/numabench", "modules/test/slowexit", "modules/tools/edit",
    "common/boot/bzimage", "common/calendar", "common/cluster/members", "common/cluster/raft", "common/cluster/registry", "common/cluster/rsmkit", "common/codec", "common/crc", "common/ipc/ipcwire", "common/ipc/mgmtwire", "common/latency", "common/net/firewall", "common/net/netwire", "common/net/sftp", "common/net/ssh", "common/net/vnetmeta", "common/net/vnetwire", "common/net/web", "common/storage/ataproto", "common/storage/diskimage", "common/storage/extfmt", "common/storage/nbsclient", "common/storage/nbscs", "common/storage/nbsmeta", "common/storage/nbswire", "common/text/conf", "common/text/edit", "common/vm/migwire", "common/vm/vmstate",
]
# What a plain `cargo build` builds: the crates the kernel links. A loadable
# module is built on its own, one package at a time and with the
# position-independent code the kernel's crates do not use (the Makefile's
# module rules), then linked into a shared object the kernel loads.
default-members = [
    "kernel",
    "base/crypto", "base/events", "base/ffi", "base/hello", "base/kcore", "base/random",
    "layers/block", "layers/fs", "layers/ipc", "layers/mgmt", "layers/net", "layers/tls",
    "drivers/block/ahci", "drivers/block/ata", "drivers/block/nvme", "drivers/block/virtio_blk", "drivers/block/virtio_scsi", "drivers/net/e1000e", "drivers/net/igb", "drivers/net/mlx4", "drivers/net/r8125", "drivers/net/r8168", "drivers/net/virtio_net", "drivers/rng/virtio_rng", "drivers/usb", "drivers/virtio",
    "common/net/netwire",
]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
