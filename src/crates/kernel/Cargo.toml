[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
ffi = { path = "../base/ffi" }
kcore = { path = "../base/kcore" }
random = { path = "../base/random" }
# ChaCha20-Poly1305 in CRYPTOGAMS' assembly: its check at boot (rust_test).
crypto = { path = "../base/crypto" }
# The management bus: below every layer, so each can register its provider.
mgmt = { path = "../layers/mgmt" }
events = { path = "../base/events" }
ipc = { path = "../layers/ipc" }
mgmtwire = { path = "../common/ipc/mgmtwire" }
block = { path = "../layers/block" }
fs = { path = "../layers/fs" }
net = { path = "../layers/net" }
hello = { path = "../base/hello" }
# For the crc32 shell command and its check at boot.
crc = { path = "../common/crc" }
ata = { path = "../drivers/block/ata" }
nvme = { path = "../drivers/block/nvme" }
usb = { path = "../drivers/usb" }
virtio-rng = { path = "../drivers/rng/virtio_rng" }
virtio-blk = { path = "../drivers/block/virtio_blk" }
virtio-net = { path = "../drivers/net/virtio_net" }
virtio-scsi = { path = "../drivers/block/virtio_scsi" }
r8168 = { path = "../drivers/net/r8168" }
r8125 = { path = "../drivers/net/r8125" }
e1000e = { path = "../drivers/net/e1000e" }
igb = { path = "../drivers/net/igb" }
# For the sha256 shell command; the same crate the TLS client hashes with.
# force-soft for the same reason .cargo/config.toml forces the other
# RustCrypto crates onto their software backends: sha2 would otherwise pick
# SHA-NI by CPUID at runtime, and those are SSE instructions run outside a
# SIMD section (kernel/simd.h) -- in registers nothing saves, which a guest
# may be holding there between its exit and its next entry. Applies to the
# TLS client too, since a crate is built once for the whole graph.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
