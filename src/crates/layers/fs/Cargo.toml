[package]
name = "fs"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
kcore = { path = "../../base/kcore" }
# The vectored calls of a disk's image (`image.rs`) implement the C ABI the
# ffi crate declares, so they take its types from there.
ffi = { path = "../../base/ffi" }
# The disks a filesystem is mounted on: the block layer itself, not the C ABI
# a module reaches it by.
block = { path = "../block" }
# The ext2/3/4 on-disk format and its checksums, which ext4 reads through: a
# crate of the tree's with no kernel in it.
extfmt = { path = "../../common/storage/extfmt" }
# What a device holds before `format` writes over it: the look hv takes
# before it gives a device to a guest.
diskimage = { path = "../../common/storage/diskimage" }
# The management bus, which the layer's provider registers on.
mgmt = { path = "../mgmt" }
# The events tasks wait on: an image's queue may be made on one.
events = { path = "../../base/events" }
