[package]
name = "block"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
kcore = { path = "../../base/kcore" }
# The table below implements the C ABI the ffi crate declares, so it takes
# the layout of an ops table from there rather than restating it.
ffi = { path = "../../base/ffi" }
# The management bus, which the layer's provider registers on.
mgmt = { path = "../mgmt" }
# The events tasks wait on: a queue made on one signals it with its
# completions, and holds it until the last of them is done.
events = { path = "../../base/events" }
# GPT's and the disk log's CRC-32: the tree's one, with no kernel in it.
crc = { path = "../../common/crc" }
