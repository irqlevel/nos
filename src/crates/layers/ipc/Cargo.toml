[package]
name = "ipc"
version = "0.1.0"
edition = "2021"

# The kernel's message channel, in the image: mailboxes with addresses and
# names in the host's namespace, messages between them, monitors that say
# when a peer is gone and watches that say when a name comes and goes --
# for the image's tasks through the crate, and for modules through the C
# ABI (base/ffi/src/ipc.rs, kcore::ipc). plans/ipc.md, docs/ipc.md.
[lib]

[dependencies]
ffi = { path = "../../base/ffi" }
kcore = { path = "../../base/kcore" }
# The events tasks wait on: a mailbox made on one signals it, and holds it.
events = { path = "../../base/events" }
# The head of a message routed to another host, which ipcnet reads.
ipcwire = { path = "../../common/ipc/ipcwire" }
