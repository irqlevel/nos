[package]
name = "fs"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
kcore = { path = "../kcore" }
# The disks a filesystem is mounted on: the block layer itself, not the C ABI
# a module reaches it by.
block = { path = "../block" }
# The ext2/3/4 on-disk format and its checksums, which ext4 reads through: a
# crate of the tree's with no kernel in it.
extfmt = { path = "../extfmt" }
