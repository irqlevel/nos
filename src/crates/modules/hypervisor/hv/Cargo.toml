[package]
name = "mod-hv"
version = "0.1.0"
edition = "2021"

[lib]
name = "mod_hv"
crate-type = ["staticlib"]

[dependencies]
kmod = { path = "../../../base/kmod" }
kcore = { path = "../../../base/kcore" }
# The hypervisor itself, and through it the CPU's extension. Neither crate is
# in the kernel's own build (they are workspace members, not default ones):
# they exist only inside this module, so a kernel without it carries none of
# the hypervisor at all.
hv = { path = "../../../hypervisor/hv" }
# The frame formats: the guests' switch answers DHCP itself, and a module
# cannot link the network layer to borrow them.
netwire = { path = "../../../common/net/netwire" }
# Each guest's firewall: its rules, what of a frame they judge, the flows a
# port keeps -- no kernel in it, so tests/fuzz/hv holds it to a model.
firewall = { path = "../../../common/net/firewall" }
# A cloud's qcow2 image made a raw disk (`hv convert`): no kernel in it, so
# tests/fuzz/diskimage runs the same code on the host.
diskimage = { path = "../../../common/storage/diskimage" }
# vm.toml's text: the strict TOML the host API's api.toml is written in too.
conf = { path = "../../../common/text/conf" }
# The vm provider's side of the management bus: the parameters a call is
# handed, read strictly.
mgmtwire = { path = "../../../common/ipc/mgmtwire" }
# A VM's UUID in hex, as vnet takes it and its table says it.
codec = { path = "../../../common/codec" }
# The cluster networks' tunnel between hosts (`tunnel.rs`): its datagram
# sealed and opened, the window of counters a key has seen, the messages keys
# go in -- no kernel in it, so tests/fuzz/hv holds it to a model.
vnetwire = { path = "../../../common/net/vnetwire" }
# The tunnel's ChaCha20-Poly1305 (`aead.rs`): CRYPTOGAMS' assembly in the
# kernel's SIMD sections, what vnetwire seals and opens by in hv.ko.
crypto = { path = "../../../base/crypto" }
# A guest's disk that is a volume of NBS's (`nbs:<volume>`): NBS's client,
# driven over ipc.
nbsdrive = { path = "../../storage/nbsdrive" }
# A volume's name as NBS's metadata takes one: an image's, a snapshot's and
# a clone's checked before anything is downloaded or asked -- linked already,
# through nbsdrive.
nbsmeta = { path = "../../../common/storage/nbsmeta" }
