[package]
name = "mod-sshd"
version = "0.1.0"
edition = "2021"

[lib]
name = "mod_sshd"
crate-type = ["staticlib"]

[dependencies]
kmod = { path = "../../../base/kmod" }
kcore = { path = "../../../base/kcore" }
ssh = { path = "../../../common/net/ssh" }
# ChaCha20 and Poly1305 for the ssh crate's cipher: CRYPTOGAMS' assembly in
# the kernel's SIMD sections
crypto = { path = "../../../base/crypto" }
