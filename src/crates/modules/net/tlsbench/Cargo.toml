[package]
name = "mod-tlsbench"
version = "0.1.0"
edition = "2021"

[lib]
name = "mod_tlsbench"
crate-type = ["staticlib"]

[dependencies]
kmod = { path = "../../../base/kmod" }
kcore = { path = "../../../base/kcore" }
# Both pinned ends, server and client, as ipcnet's links will be.
tls = { path = "../../../layers/tls", features = ["pinned"] }
# The two ends' keys and certificates, made at each run.
web = { path = "../../../common/net/web" }
# The cipher alone: the crypto crate's ChaCha20-Poly1305, which the suites
# run on, and RustCrypto's, which they ran on before it.
crypto = { path = "../../../base/crypto" }
chacha20poly1305 = { version = "0.10", default-features = false }
