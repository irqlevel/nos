[package]
name = "mod-cluster"
version = "0.1.0"
edition = "2021"

# The cluster's registry as a module (plans/cluster.md, C1): raft's
# replicated state machine over the registry's state, its log on this
# host's disk, its messages over ipc -- and ipcnet told the peers it keeps.
[lib]
name = "mod_cluster"
crate-type = ["staticlib"]

[dependencies]
kmod = { path = "../../../base/kmod" }
kcore = { path = "../../../base/kcore" }
raft = { path = "../../../common/cluster/raft" }
# The member's engine: raft over ipc, shared with nbs-mds.ko.
raftmember = { path = "../raftmember" }
registry = { path = "../../../common/cluster/registry" }
# ipcnet's control mailbox, which this host's peers are given through.
ipcwire = { path = "../../../common/ipc/ipcwire" }
# An invitation's secret kept as its hash.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
# The `cluster` provider's parameters, as the management bus has them.
mgmtwire = { path = "../../../common/ipc/mgmtwire" }
