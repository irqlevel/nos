[package]
name = "mod-ipcnet"
version = "0.1.0"
edition = "2021"

[lib]
name = "mod_ipcnet"
crate-type = ["staticlib"]

[dependencies]
kmod = { path = "../../kmod" }
kcore = { path = "../../kcore" }
# Both pinned ends: the server a peer dials, the client this host dials with.
tls = { path = "../../tls", features = ["pinned"] }
# The host's key and its certificate, made at the first start.
web = { path = "../../web" }
# What two hosts say inside their session.
ipcwire = { path = "../../ipcwire" }
# hosts.toml.
conf = { path = "../../conf" }
zeroize = { version = "1", default-features = false }
