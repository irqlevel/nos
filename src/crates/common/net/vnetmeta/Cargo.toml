[package]
name = "vnetmeta"
version = "0.1.0"
edition = "2021"

# vnet's state (plans/vnet.md, "The state"): what every host's member of
# the vnet group keeps replicated through raft's rsm -- the group and its
# members, the cluster's networks, their ports, the public addresses and the
# cluster's firewalls -- and the commands that change it. No kernel in it
# and no unsafe: vnet.ko builds it, and tests/fuzz/raft's vnetmeta target
# holds it to a model of its own.
[lib]

[dependencies]
raft = { path = "../../cluster/raft" }
members = { path = "../../cluster/members" }
rsmkit = { path = "../../cluster/rsmkit" }
codec = { path = "../../codec" }
# A firewall's rules, read and written as hv's are.
firewall = { path = "../firewall" }
