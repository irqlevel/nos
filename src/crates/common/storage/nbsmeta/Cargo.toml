[package]
name = "nbsmeta"
version = "0.1.0"
edition = "2021"

# NBS's metadata (plans/nbs.md): the state every host's mds keeps
# replicated through raft's rsm, and the commands that change it -- the NBS
# cluster's identity and its members (N5), and what is stored and where:
# chunk servers and their devices, volumes, chunks, replica sets (N6). No
# kernel in it and no unsafe: nbs-mds.ko builds it, fuzz/raft's nbsmeta
# target holds it under raft, and fuzz/nbs's meta target to a model of its
# own.
[lib]

[dependencies]
raft = { path = "../../cluster/raft" }
ipcwire = { path = "../../ipc/ipcwire" }
codec = { path = "../../codec" }
# The state's digest, which every member holds its own to: on the software
# backend the kernel builds the RustCrypto crates with.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
