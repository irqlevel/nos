[package]
name = "nbsclient"
version = "0.1.0"
edition = "2021"

# NBS's client (plans/nbs.md, N8): a volume attached on this host, read and
# written through the cs's that hold its chunks -- every replica written, one
# read, a replica that does not answer taken out -- as a state machine fed
# what comes and the time, and telling its driver what to send. No kernel in
# it and no unsafe: hv's nbs: disks, nbs io and nbsload drive it over ipc,
# and fuzz/nbs's cluster target drives it over a network of its own.
[lib]

# The fuzzer's alone (fuzz/nbs, #97): a session's write requests made to
# find no memory until a time (`Session::starve_until`), as a kernel's heap
# may refuse one -- never in a kernel's build.
[features]
starve = []
# The fuzzer's alone too: closes let out two places at a time
# (`CLOSING_MAX`), so that a target whose volume has a few chunks steps a
# stop, a pause and a close of the driver's through window after window.
small_windows = []

[dependencies]
nbscs = { path = "../nbscs" }
nbsmeta = { path = "../nbsmeta" }
nbswire = { path = "../nbswire" }
