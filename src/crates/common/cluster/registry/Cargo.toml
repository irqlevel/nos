[package]
name = "registry"
version = "0.1.0"
edition = "2021"

# The registry of a nos cluster's hosts (plans/cluster.md): the state the
# cluster module keeps replicated through raft's rsm -- the cluster's hosts,
# their keys, addresses and labels, the hosts removed and the invitations
# open -- and the commands that change it. No kernel in it and no unsafe:
# the cluster module builds it, and fuzz/raft holds it to a model of its
# own.
[lib]

[dependencies]
raft = { path = "../raft" }
ipcwire = { path = "../../ipc/ipcwire" }
