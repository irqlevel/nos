[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
ffi = { path = "../ffi" }
kcore = { path = "../kcore" }
block = { path = "../block" }
fs = { path = "../fs" }
hello = { path = "../hello" }
tls = { path = "../tls" }
nvme = { path = "../drivers/nvme" }
virtio-rng = { path = "../drivers/virtio_rng" }
virtio-blk = { path = "../drivers/virtio_blk" }
virtio-net = { path = "../drivers/virtio_net" }
virtio-scsi = { path = "../drivers/virtio_scsi" }
r8168 = { path = "../drivers/r8168" }
r8125 = { path = "../drivers/r8125" }
igb = { path = "../drivers/igb" }
# For the sha256 shell command; the same crate the TLS client hashes with.
# force-soft for the same reason .cargo/config.toml forces the other
# RustCrypto crates onto their software backends: sha2 would otherwise pick
# SHA-NI by CPUID at runtime, and those are SSE instructions -- an
# application processor here runs with CR4.OSFXSR clear, so the first
# block hashed on one is an invalid opcode. Applies to the TLS client too,
# since a crate is built once for the whole graph.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
