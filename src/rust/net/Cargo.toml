[package]
name = "net"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
kcore = { path = "../kcore" }
# The frame formats, shared with the modules that build their own frames:
# `net::wire` is this crate.
netwire = { path = "../netwire" }
# ICMP tells the C++ TCP about an unreachable; that declaration lives here.
ffi = { path = "../ffi" }
# The HTTP client speaks plain TCP or TLS over it.
tls = { path = "../tls" }
# `wget` saves to a file: the filesystem layer itself, not the C ABI a module
# reaches it by.
fs = { path = "../fs" }
